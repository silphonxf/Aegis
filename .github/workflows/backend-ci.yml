name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/check_dm_connection.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/check_dm_connection.sh'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      run_dm_check:
        description: 'Run optional Dameng connectivity check'
        required: false
        default: 'false'

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./aegis.db
      SECRET_KEY: ci_secret_key_for_backend_smoke
      INIT_ADMIN_PASSWORD: ci_admin_password_for_backend_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Alembic migration (SQLite)
        run: |
          cd backend
          alembic upgrade head

      - name: Start API and health check
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/aegis_backend_ci.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8000/healthz

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: /tmp/aegis_backend_ci.log

  optional-dameng-check:
    runs-on: ubuntu-latest
    needs: backend-smoke
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.run_dm_check == 'true') || vars.RUN_DM_CHECK == 'true' }}
    env:
      DM_HOST: ${{ secrets.DM_HOST }}
      DM_PORT: ${{ secrets.DM_PORT }}
      DM_NAME: ${{ secrets.DM_NAME }}
      DM_USER: ${{ secrets.DM_USER }}
      DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Dameng env
        run: |
          test -n "$DM_HOST"
          test -n "$DM_PORT"
          test -n "$DM_USER"
          test -n "$DM_PASSWORD"

      - name: Run Dameng connection check script
        run: |
          chmod +x scripts/check_dm_connection.sh
          ./scripts/check_dm_connection.sh
