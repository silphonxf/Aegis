name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./aegis.db
      SECRET_KEY: ci_secret_key_for_backend_smoke
      INIT_ADMIN_PASSWORD: ci_admin_password_for_backend_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Alembic migration (SQLite)
        run: |
          cd backend
          alembic upgrade head

      - name: Start API and health check
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/aegis_backend_ci.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8000/healthz

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: /tmp/aegis_backend_ci.log
